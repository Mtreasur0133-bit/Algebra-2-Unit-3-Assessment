<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 60px 20px;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .action-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background-color: #0076ff;
            color: white;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
        }
        .action-btn:hover {
            background-color: #005fd1;
        }
        .action-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>App Portal</h2>
        <p>Click below to open the application container cleanly in a detached document environment.</p>
        <button id="launcher" class="action-btn">Initialize Container</button>
    </div>

    <script>
        // Use standard event listeners instead of inline attributes to prevent CSP blocks
        document.getElementById('launcher').addEventListener('click', function() {
            
            // 1. Establish the clean blank tab context first
            const targetWindow = window.open('about:blank', '_blank');
            
            if (!targetWindow) {
                alert('Pop-up blocker detected. Please allow pop-ups for this page to initialize.');
                return;
            }

            // 2. Generate elements via DOM node creation rather than string parsing
            const doc = targetWindow.document;
            const targetFrame = doc.createElement('iframe');
            
            // Define source explicitly
            targetFrame.src = "https://freezenova.com";
            
            // 3. Apply styles programmatically to adapt cleanly to the new window body
            Object.assign(doc.body.style, {
                margin: '0',
                padding: '0',
                height: '100vh',
                width: '100vw',
                overflow: 'hidden',
                backgroundColor: '#000000'
            });

            Object.assign(targetFrame.style, {
                border: 'none',
                width: '100%',
                height: '100%',
                margin: '0',
                padding: '0'
            });

            // Allow standard full screen permissions inside the execution window
            targetFrame.setAttribute('allowfullscreen', 'true');

            // 4. Attach directly to the new frame cleanly 
            doc.body.appendChild(targetFrame);
        });
    </script>

</body>
</html>
