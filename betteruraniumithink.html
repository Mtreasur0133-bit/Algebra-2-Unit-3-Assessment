<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Uranium Games
    </title>
    <link id="favicon" rel="icon" href="data:image/svg+xml,&lt;svg xmlns=&#39;http://www.w3.org/2000/svg&#39; viewBox=&#39;0 0 100 100&#39;&gt;&lt;text y=&#39;.9em&#39; font-size=&#39;90&#39;&gt;☢️&lt;/text&gt;&lt;/svg&gt;" />
    <style>
      :root {
  --primary: #00ff88;
  --primary-rgb: 0, 255, 136;
  --bg: #0a0e1a;
  --card-bg: rgba(10, 20, 30, 0.85);
  --glow: 0.35;
  --blur: 12px;
  --card-radius: 18px;
  --font-scale: 1;
  --anim-strength: 1;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:&#39;Segoe UI&#39;,system-ui,Tahoma,Geneva,Verdana,sans-serif;
  background:var(--bg);
  min-height:100vh;
  color:#fff;
  overflow-x:hidden;
  position:relative;
  font-size:calc(16px * var(--font-scale));
}
body::before{
  content:&#39;&#39;;
  position:fixed;inset:0;
  background:
    radial-gradient(circle at 20% 50%,rgba(var(--primary-rgb),0.12) 0%,transparent 50%),
    radial-gradient(circle at 80% 80%,rgba(var(--primary-rgb),0.10) 0%,transparent 50%),
    radial-gradient(circle at 40% 20%,rgba(var(--primary-rgb),0.06) 0%,transparent 40%);
  pointer-events:none;z-index:0;
}

.container{max-width:1440px;margin:0 auto;padding:20px;position:relative;z-index:1;}

header{
  text-align:center;
  padding:42px 24px 36px;
  background:var(--card-bg);
  backdrop-filter:blur(var(--blur));
  border-radius:22px;
  margin-bottom:28px;
  box-shadow:
    0 0 calc(40px * var(--glow)) rgba(var(--primary-rgb),0.35),
    inset 0 0 60px rgba(var(--primary-rgb),0.08),
    0 10px 36px rgba(0,0,0,0.55);
  border:1px solid rgba(var(--primary-rgb),0.32);
  position:relative;overflow:hidden;
  animation:slideDown 0.55s ease-out, glowPulse 3.2s ease-in-out infinite;
}
header::before{
  content:&#39;☢️&#39;;
  position:absolute;font-size:14em;opacity:0.04;
  top:50%;left:50%;transform:translate(-50%,-50%);
  animation:rotate 22s linear infinite;
  pointer-events:none;
}
@keyframes rotate{to{transform:translate(-50%,-50%) rotate(360deg);}}
@keyframes slideDown{from{opacity:0;transform:translateY(-28px);}to{opacity:1;transform:translateY(0);}}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 calc(40px * var(--glow)) rgba(var(--primary-rgb),0.35),inset 0 0 60px rgba(var(--primary-rgb),0.08),0 10px 36px rgba(0,0,0,0.55);}
  50%{box-shadow:0 0 calc(60px * var(--glow)) rgba(var(--primary-rgb),0.5),inset 0 0 80px rgba(var(--primary-rgb),0.12),0 10px 36px rgba(0,0,0,0.55);}
}

h1{
  font-size:3.6em;font-weight:900;letter-spacing:4px;margin-bottom:6px;
  background:linear-gradient(90deg,var(--primary),#39ff14,var(--primary));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-shadow:0 0 18px rgba(var(--primary-rgb),0.55);
  position:relative;z-index:1;
}
.tagline{font-size:1.05em;color:var(--primary);opacity:0.85;position:relative;z-index:1;}
.status-line{margin-top:10px;font-size:0.78em;letter-spacing:1.5px;color:rgba(var(--primary-rgb),0.65);position:relative;z-index:1;}

.clock-wrap{
  position:absolute;top:18px;right:22px;
  font-variant-numeric:tabular-nums;
  font-size:0.95em;letter-spacing:1px;
  color:var(--primary);
  text-shadow:0 0 12px rgba(var(--primary-rgb),0.5);
  z-index:2;
  display:flex;flex-direction:column;align-items:flex-end;gap:2px;
}
.clock-time{font-weight:700;font-size:1.15em;}
.clock-date{font-size:0.72em;opacity:0.7;}

/* ===== APPS SECTION ===== */
.apps-section {
  margin-bottom: 32px;
}
.section-title {
  font-size: 1.15em;
  color: var(--primary);
  margin-bottom: 14px;
  letter-spacing: 1px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.apps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 18px;
}
.app-card {
  background: var(--card-bg);
  backdrop-filter: blur(var(--blur));
  border-radius: 16px;
  border: 1px solid rgba(var(--primary-rgb), 0.35);
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: all 0.25s ease;
  box-shadow: 0 0 18px rgba(var(--primary-rgb), 0.15);
}
.app-card:hover {
  transform: translateY(-4px);
  border-color: var(--primary);
  box-shadow: 0 0 28px rgba(var(--primary-rgb), 0.35);
}
.app-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: rgba(var(--primary-rgb), 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6em;
  flex-shrink: 0;
}
.app-info h3 {
  font-size: 1.05em;
  color: var(--primary);
  margin-bottom: 3px;
}
.app-info p {
  font-size: 0.78em;
  color: rgba(var(--primary-rgb), 0.6);
}

.top-controls{
  display:flex;justify-content:center;gap:14px;flex-wrap:wrap;
  margin:0 0 22px;align-items:center;
}
.search-bar input{
  width:min(520px,90vw);padding:14px 24px;font-size:1.05em;
  border:2px solid rgba(var(--primary-rgb),0.38);
  border-radius:50px;background:rgba(10,20,30,0.92);
  color:var(--primary);box-shadow:0 0 18px rgba(var(--primary-rgb),0.18);
  transition:all 0.25s ease;
}
.search-bar input::placeholder{color:rgba(var(--primary-rgb),0.45);}
.search-bar input:focus{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 28px rgba(var(--primary-rgb),0.4);
  transform:scale(1.015);
}

.filter-bar{display:flex;justify-content:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.filter-btn,.settings-btn{
  background:rgba(10,20,30,0.9);
  border:2px solid rgba(var(--primary-rgb),0.28);
  color:rgba(var(--primary-rgb),0.75);
  padding:9px 20px;border-radius:30px;font-size:0.88em;font-weight:600;
  letter-spacing:0.8px;cursor:pointer;transition:all 0.22s ease;
}
.filter-btn:hover,.settings-btn:hover{
  border-color:var(--primary);color:var(--primary);
  box-shadow:0 0 14px rgba(var(--primary-rgb),0.28);
}
.filter-btn.active{
  background:var(--primary);color:#000;border-color:var(--primary);
  box-shadow:0 0 18px rgba(var(--primary-rgb),0.55);
}

.game-count{font-size:0.95em;color:var(--primary);text-align:right;padding-right:8px;margin-bottom:8px;opacity:0.9;font-weight:600;}

.games-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(var(--card-min,200px),1fr));
  gap:26px;margin-top:20px;justify-items:center;
}
@media(max-width:1000px){.games-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:700px){.games-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:420px){.games-grid{grid-template-columns:1fr;}}

.game-card{
  background:var(--card-bg);backdrop-filter:blur(var(--blur));
  border-radius:var(--card-radius);overflow:hidden;cursor:pointer;
  transition:transform 0.35s ease,box-shadow 0.35s ease,border-color 0.25s;
  box-shadow:0 0 18px rgba(var(--primary-rgb),0.18),0 8px 22px rgba(0,0,0,0.5);
  border:1px solid rgba(var(--primary-rgb),0.28);
  text-decoration:none;color:inherit;display:block;width:100%;max-width:230px;
  animation:fadeInUp 0.45s ease-out both;
}
.game-card:hover{
  transform:translateY(calc(-10px * var(--anim-strength))) scale(calc(1 + 0.025 * var(--anim-strength)));
  box-shadow:0 0 36px rgba(var(--primary-rgb),0.45),0 14px 36px rgba(0,0,0,0.55);
  border-color:var(--primary);
}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}

.game-image{width:100%;aspect-ratio:1/1;background:linear-gradient(135deg,#001a0f,#003d29);position:relative;overflow:hidden;}
.game-image img{width:100%;height:100%;object-fit:cover;transition:transform 0.35s ease;}
.game-card:hover .game-image img{transform:scale(1.06);}
.game-image .fallback{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:6px;color:rgba(var(--primary-rgb),0.5);
  font-size:0.72em;letter-spacing:1.5px;text-align:center;padding:10px;
}
.game-info{padding:16px 18px 18px;}
.game-title{font-size:1.12em;font-weight:700;margin-bottom:3px;color:var(--primary);text-shadow:0 0 10px rgba(var(--primary-rgb),0.4);}
.game-author{font-size:0.7em;color:rgba(var(--primary-rgb),0.5);letter-spacing:0.8px;}

.floating-particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.particle{
  position:absolute;width:3px;height:3px;background:var(--primary);
  border-radius:50%;box-shadow:0 0 10px var(--primary);
  animation:float 14s infinite ease-in-out;
  opacity:0;
}
@keyframes float{
  0%,100%{transform:translateY(0) translateX(0);opacity:0;}
  12%,88%{opacity:0.85;}
  50%{transform:translateY(-110px) translateX(40px);}
}

.loading-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:rgba(var(--primary-rgb),0.7);}
.spinner{
  width:38px;height:38px;border:3px solid rgba(var(--primary-rgb),0.2);
  border-top-color:var(--primary);border-radius:50%;margin:0 auto 14px;
  animation:spin 0.75s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== GAME MODAL ===== */
#gameModal{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.94);
  z-index:9999;align-items:center;justify-content:center;flex-direction:column;
}
#gameFrame{display:block;width:92vw;height:86vh;max-width:1400px;max-height:900px;border:3px solid var(--primary);border-radius:16px;box-shadow:0 0 30px rgba(var(--primary-rgb),0.55);background:#000;}
#gameModal:fullscreen{background:#000;}
#gameModal:fullscreen #gameFrame{width:100vw;height:100vh;max-width:none;max-height:none;border:none;border-radius:0;box-shadow:none;}
.modal-controls {
  position: absolute;
  top: 18px;
  right: 20px;
  display: flex;
  gap: 10px;
  z-index: 10;
}
.modal-btn {
  background: var(--primary);
  color: #000;
  font-weight: 700;
  font-size: 0.95em;
  padding: 10px 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 0 18px rgba(var(--primary-rgb), 0.55);
  transition: 0.25s;
}
.modal-btn:hover {
  filter: brightness(1.15);
  transform: scale(1.04);
}
#modalError{display:none;flex-direction:column;align-items:center;gap:12px;color:#ff5c5c;text-align:center;max-width:420px;}
#modalError .icon{font-size:2.3em;}

/* Settings Panel */
.settings-panel{
  position:fixed;top:0;right:-400px;width:380px;max-width:95vw;height:100%;
  background:rgba(8,14,22,0.97);backdrop-filter:blur(18px);
  border-left:1px solid rgba(var(--primary-rgb),0.3);
  z-index:10000;padding:28px 24px;overflow-y:auto;
  transition:right 0.32s cubic-bezier(0.22,1,0.36,1);
  box-shadow:-12px 0 40px rgba(0,0,0,0.5);
}
.settings-panel.open{right:0;}
.settings-panel h2{color:var(--primary);margin-bottom:22px;font-size:1.4em;letter-spacing:1px;}
.settings-group{margin-bottom:20px;}
.settings-group label{display:block;font-size:0.84em;color:rgba(var(--primary-rgb),0.75);margin-bottom:7px;letter-spacing:0.5px;}
.settings-group input[type=&#34;color&#34;],
.settings-group input[type=&#34;range&#34;],
.settings-group select{
  width:100%;padding:9px;border-radius:10px;border:1px solid rgba(var(--primary-rgb),0.3);
  background:rgba(0,0,0,0.35);color:#fff;
}
.settings-group input[type=&#34;range&#34;]{padding:0;accent-color:var(--primary);}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:12px;}
.settings-actions{display:flex;gap:12px;margin-top:24px;}
.settings-actions button{
  flex:1;padding:12px;border-radius:12px;border:none;font-weight:700;cursor:pointer;
  background:var(--primary);color:#000;font-size:0.95em;
}
.settings-actions button.secondary{background:transparent;border:2px solid rgba(var(--primary-rgb),0.4);color:var(--primary);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9998;display:none;}
.overlay.show{display:block;}

/* Stealth visual */
body.stealth header::before{content:&#39;📊&#39;;}
body.stealth h1{
  background:linear-gradient(90deg,#4285f4,#34a853,#fbbc05,#ea4335);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;letter-spacing:1px;
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}
}
body.reduced-motion *,body.reduced-motion *::before,body.reduced-motion *::after{
  animation-duration:0.01ms !important;transition-duration:0.01ms !important;
}
    </style>
  </head>
  <body>
    <div class="floating-particles" id="particles">

</span>

</span>

    <script>

/* ========== EXTERNAL SOURCES (GN Math etc.) ========== */

/* ========== FULL GAME LIST ========== */

/* ========== SETTINGS ========== */
function loadSettings() {
  try {
    const raw = localStorage.getItem(&#39;uraniumSettings&#39;);
    return raw ? { ...DEFAULTS, ...JSON.parse(raw) } : { ...DEFAULTS };
  } catch { return { ...DEFAULTS }; }
}
function saveSettings() {
  localStorage.setItem(&#39;uraniumSettings&#39;, JSON.stringify(settings));
}

  if (settings.stealth) {
    document.body.classList.add(&#39;stealth&#39;);
    const profile = CLOAK_PROFILES[Math.floor(Math.random() * CLOAK_PROFILES.length)];
    document.title = profile.title;
    titleEl.textContent = profile.icon + &#34; &#34; + profile.title;
    taglineEl.textContent = &#34;Educational resources and tools&#34;;
    favicon.href = `data:image/svg+xml,&lt;svg xmlns=&#39;http://www.w3.org/2000/svg&#39; viewBox=&#39;0 0 100 100&#39;&gt;&lt;text y=&#39;.9em&#39; font-size=&#39;90&#39;&gt;${profile.icon}&lt;/text&gt;&lt;/svg&gt;`;

    if (cloakInterval) clearInterval(cloakInterval);
    cloakInterval = setInterval(() =&gt; {
      if (settings.stealth) {
        const p = CLOAK_PROFILES[Math.floor(Math.random() * CLOAK_PROFILES.length)];
        document.title = p.title;
        favicon.href = `data:image/svg+xml,&lt;svg xmlns=&#39;http://www.w3.org/2000/svg&#39; viewBox=&#39;0 0 100 100&#39;&gt;&lt;text y=&#39;.9em&#39; font-size=&#39;90&#39;&gt;${p.icon}&lt;/text&gt;&lt;/svg&gt;`;
      }
    }, 9000 + Math.random() * 6000);
  } else {
    document.body.classList.remove(&#39;stealth&#39;);
    document.title = &#34;Uranium Games&#34;;
    titleEl.textContent = &#34;☢️ URANIUM&#34;;
    taglineEl.textContent = &#34;Play hundreds of games instantly&#34;;
    favicon.href = &#34;data:image/svg+xml,&lt;svg xmlns=&#39;http://www.w3.org/2000/svg&#39; viewBox=&#39;0 0 100 100&#39;&gt;&lt;text y=&#39;.9em&#39; font-size=&#39;90&#39;&gt;☢️&lt;/text&gt;&lt;/svg&gt;&#34;;
    if (cloakInterval) {
      clearInterval(cloakInterval);
      cloakInterval = null;
    }
  }
}

function applySettings() {
  const root = document.documentElement;
  root.style.setProperty(&#39;--primary&#39;, settings.primary);
  const r = parseInt(settings.primary.slice(1,3),16);
  const g = parseInt(settings.primary.slice(3,5),16);
  const b = parseInt(settings.primary.slice(5,7),16);
  root.style.setProperty(&#39;--primary-rgb&#39;, `${r},${g},${b}`);
  root.style.setProperty(&#39;--bg&#39;, settings.bg);
  root.style.setProperty(&#39;--glow&#39;, settings.glow / 100);
  root.style.setProperty(&#39;--blur&#39;, settings.blur + &#39;px&#39;);
  root.style.setProperty(&#39;--card-min&#39;, settings.card + &#39;px&#39;);
  root.style.setProperty(&#39;--font-scale&#39;, settings.font / 100);
  root.style.setProperty(&#39;--anim-strength&#39;, settings.anim / 100);
  document.body.style.background = settings.bg;
  document.body.classList.toggle(&#39;reduced-motion&#39;, settings.reducedMotion);
  buildParticles(settings.particles);
  applyCloaking();

  document.getElementById(&#39;glowVal&#39;).textContent = settings.glow + &#39;%&#39;;
  document.getElementById(&#39;blurVal&#39;).textContent = settings.blur + &#39;px&#39;;
  document.getElementById(&#39;cardVal&#39;).textContent = settings.card + &#39;px&#39;;
  document.getElementById(&#39;fontVal&#39;).textContent = settings.font + &#39;%&#39;;
  document.getElementById(&#39;animVal&#39;).textContent = settings.anim + &#39;%&#39;;
  document.getElementById(&#39;partVal&#39;).textContent = settings.particles;
}

function buildParticles(count) {
  particlesEl.innerHTML = &#39;&#39;;
  for (let i = 0; i &lt; count; i++) {
    const p = document.createElement(&#39;div&#39;);
    p.className = &#39;particle&#39;;
    p.style.left = Math.random() * 100 + &#39;%&#39;;
    p.style.top  = Math.random() * 100 + &#39;%&#39;;
    p.style.animationDelay = (Math.random() * 12) + &#39;s&#39;;
    p.style.animationDuration = (10 + Math.random() * 10) + &#39;s&#39;;
    particlesEl.appendChild(p);
  }
}

function updateClock() {
  const now = new Date();
  const optsTime = { hour: &#39;2-digit&#39;, minute: &#39;2-digit&#39;, second: &#39;2-digit&#39;, hour12: settings.clockFormat === &#39;12&#39; };
  const optsDate = { weekday: &#39;short&#39;, month: &#39;short&#39;, day: &#39;numeric&#39; };
  document.getElementById(&#39;clockTime&#39;).textContent = now.toLocaleTimeString([], optsTime);
  document.getElementById(&#39;clockDate&#39;).textContent = now.toLocaleDateString([], optsDate);
}

/* ========== RENDER ========== */
function renderGames(list) {
  gameCountEl.textContent = list.length + &#39; Games&#39;;
  gamesGrid.innerHTML = &#39;&#39;;
  if (list.length === 0) {
    gamesGrid.innerHTML = &#39;&lt;div class=&#34;loading-state&#34;&gt;No games match your search.&lt;/div&gt;&#39;;
    return;
  }
  const frag = document.createDocumentFragment();
  list.forEach((game, i) =&gt; {
    const card = document.createElement(&#39;a&#39;);
    card.href = &#39;#&#39;;
    card.className = &#39;game-card&#39;;
    card.style.animationDelay = (Math.min(i, 30) * 0.025) + &#39;s&#39;;
    const sourceBadge = game.source === &#39;gnmath&#39;
      ? &#39;&lt;span style=&#34;font-size:0.65em;opacity:0.55;letter-spacing:0.5px;&#34;&gt;GN Math&lt;/span&gt;&#39;
      : &#39;&lt;span style=&#34;font-size:0.65em;opacity:0.55;letter-spacing:0.5px;&#34;&gt;Uranium&lt;/span&gt;&#39;;
    card.innerHTML = `
      &lt;div class=&#34;game-image&#34;&gt;
        &lt;img src=&#34;${game.resolvedCover || &#39;&#39;}&#34; alt=&#34;${game.name}&#34; loading=&#34;lazy&#34;
          onerror=&#34;this.style.display=&#39;none&#39;;this.parentElement.querySelector(&#39;.fallback&#39;).style.display=&#39;flex&#39;;&#34;&gt;
        &lt;div class=&#34;fallback&#34;&gt;NO IMAGE&lt;br&gt;${game.name}&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&#34;game-info&#34;&gt;
        &lt;div class=&#34;game-title&#34;&gt;${game.name}&lt;/div&gt;
        &lt;div class=&#34;game-author&#34;&gt;${game.author || &#39;Unknown&#39;} · ${sourceBadge}&lt;/div&gt;
      &lt;/div&gt;`;
    card.onclick = e =&gt; { e.preventDefault(); openGame(game); };
    frag.appendChild(card);
  });
  gamesGrid.appendChild(frag);
}

function buildFilterBar() {
  const filters = [
    { id: &#39;all&#39;, label: &#39;All&#39; },
    { id: &#39;uranium&#39;, label: &#39;Uranium&#39; },
    { id: &#39;gnmath&#39;, label: &#39;GN Math&#39; },
    { id: &#39;flash&#39;, label: &#39;Flash&#39; },
    { id: &#39;port&#39;, label: &#39;Ports&#39; },
    { id: &#39;emulator&#39;, label: &#39;Emulator&#39; },
    { id: &#39;fnf&#39;, label: &#39;FNF&#39; }
  ];
  filterBar.innerHTML = &#39;&#39;;
  filters.forEach(f =&gt; {
    const btn = document.createElement(&#39;button&#39;);
    btn.className = &#39;filter-btn&#39; + (currentFilter === f.id ? &#39; active&#39; : &#39;&#39;);
    btn.textContent = f.label;
    btn.dataset.filter = f.id;
    btn.onclick = () =&gt; {
      currentFilter = f.id;
      filterBar.querySelectorAll(&#39;.filter-btn&#39;).forEach(b =&gt; b.classList.toggle(&#39;active&#39;, b.dataset.filter === currentFilter));
      handleSearch();
    };
    filterBar.appendChild(btn);
  });
}

function handleSearch() {
  const query = searchInput.value.toLowerCase().trim();
  let results = allGames;

  // Source / special filter
  if (currentFilter === &#39;uranium&#39;) {
    results = results.filter(g =&gt; g.source === &#39;uranium&#39;);
  } else if (currentFilter === &#39;gnmath&#39;) {
    results = results.filter(g =&gt; g.source === &#39;gnmath&#39;);
  } else if ([&#39;flash&#39;, &#39;port&#39;, &#39;emulator&#39;, &#39;fnf&#39;].includes(currentFilter)) {
    results = results.filter(g =&gt; Array.isArray(g.special) &amp;&amp; g.special.includes(currentFilter));
  }

  // Text search
  if (query) {
    const tokens = query.split(/\s+/);
    results = results.filter(g =&gt; {
      const target = `${g.name} ${g.author || &#39;&#39;}`.toLowerCase();
      return tokens.every(t =&gt; target.includes(t));
    });
  }
  renderGames(results);
}

async function fetchGnMathSource(src) {
  try {
    const res = await fetch(src.json + &#39;?t=&#39; + Date.now());
    if (!res.ok) throw new Error(&#39;HTTP &#39; + res.status);
    const data = await res.json();
    if (!Array.isArray(data)) return [];
    return data
      .filter(g =&gt; g &amp;&amp; g.name &amp;&amp; g.url &amp;&amp; g.id !== -1) // skip discord promo
      .map(g =&gt; {
        let resolvedUrl = String(g.url)
          .replace(/\{HTML_URL\}/g, src.html)
          .replace(/\{COVER_URL\}/g, src.cover);
        let resolvedCover = String(g.cover || &#39;&#39;)
          .replace(/\{COVER_URL\}/g, src.cover)
          .replace(/\{HTML_URL\}/g, src.html);
        // External links (e.g. discord already filtered) keep as-is
        if (resolvedUrl.startsWith(&#39;{&#39;)) resolvedUrl = g.url;
        if (resolvedCover.startsWith(&#39;{&#39;) || !resolvedCover) {
          resolvedCover = &#39;&#39;;
        }
        return {
          name: g.name,
          author: g.author || &#39;GN Math&#39;,
          resolvedCover,
          resolvedUrl,
          source: src.sourceTag,
          special: Array.isArray(g.special) ? g.special : [],
          id: g.id
        };
      })
      .filter(g =&gt; g.resolvedUrl &amp;&amp; (g.resolvedUrl.startsWith(&#39;http&#39;) || g.resolvedUrl.startsWith(&#39;//&#39;)));
  } catch (err) {
    console.warn(&#39;Failed to load&#39;, src.name, err);
    return [];
  }
}

async function loadAllSources() {
  statusLine.textContent = &#39;Loading games…&#39;;
  // Tag built-in games
  const uraniumGames = customGames.map(g =&gt; ({
    ...g,
    source: &#39;uranium&#39;,
    special: g.special || []
  }));

  // Fetch external JSON sources in parallel
  const externalLists = await Promise.all(
    externalSources.map(src =&gt; fetchGnMathSource(src))
  );
  const gnGames = externalLists.flat();

  allGames = [...uraniumGames, ...gnGames];

  // Dedupe by name + url
  const unique = [];
  const seen = new Set();
  for (const item of allGames) {
    const key = (item.name + &#39;|&#39; + item.resolvedUrl).toLowerCase();
    if (!seen.has(key)) {
      seen.add(key);
      unique.push(item);
    }
  }
  allGames = unique;

  try {
    localStorage.setItem(&#39;uraniumGamesCache&#39;, JSON.stringify(allGames));
  } catch (_) {}

  const uCount = allGames.filter(g =&gt; g.source === &#39;uranium&#39;).length;
  const gCount = allGames.filter(g =&gt; g.source === &#39;gnmath&#39;).length;
  statusLine.textContent = settings.stealth
    ? `${allGames.length} resources ready`
    : `${allGames.length} games ready · Uranium ${uCount} · GN Math ${gCount}`;

  buildFilterBar();
  handleSearch();
}

/* ========== GAME / APP OPENING ========== */
function showModalError(name, reason) {
  gameFrame.style.display = &#39;none&#39;;
  modalError.style.display = &#39;flex&#39;;
  document.getElementById(&#39;modalErrorTitle&#39;).textContent = name + &#39; failed to load&#39;;
  document.getElementById(&#39;modalErrorReason&#39;).textContent = reason;
}
function hideModalError() {
  modalError.style.display = &#39;none&#39;;
  gameFrame.style.display = &#39;block&#39;;
}

function getCloakingScript() {
  return `&lt;script&gt;
    (function(){
      window.onbeforeunload = function(){ return &#34;Stay on this page&#34;; };
      window.open = function(){ return null; };
      const killAds = function(){
        document.querySelectorAll(&#39;.ad,.ads,.adsbygoogle,.banner-ads,[id^=&#34;ad-&#34;],iframe[src*=&#34;doubleclick&#34;],iframe[src*=&#34;googleads&#34;]&#39;).forEach(el =&gt; el.remove());
      };
      setInterval(killAds, 500);
      killAds();
    })();
  &lt;\/script&gt;`;
}

function openGame(game) {
  openInModal(game.name, game.resolvedUrl);
}

function openApp(name, url) {
  openInModal(name, url);
}

function openInModal(name, url) {
  if (!url) return;
  gameFrame.src = &#39;about:blank&#39;;
  hideModalError();
  gameModal.style.display = &#39;flex&#39;;
  document.body.style.overflow = &#39;hidden&#39;;
  gameModal.classList.add(&#39;open&#39;);

  const cacheBuster = url + (url.includes(&#39;?&#39;) ? &#39;&amp;&#39; : &#39;?&#39;) + &#39;t=&#39; + Date.now();
  fetch(cacheBuster)
    .then(res =&gt; {
      if (!res.ok) throw new Error(&#39;HTTP_&#39; + res.status);
      return res.text();
    })
    .then(html =&gt; {
      if (html.length &lt; 50) throw new Error(&#39;EMPTY&#39;);
      if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
      const safety = getCloakingScript();
      const finalHtml = html.toLowerCase().includes(&#39;&lt;head&gt;&#39;)
        ? html.replace(/&lt;head&gt;/i, &#39;&lt;head&gt;&#39; + safety)
        : safety + html;
      currentBlobUrl = URL.createObjectURL(new Blob([finalHtml], {type:&#39;text/html;charset=utf-8&#39;}));
      gameFrame.src = currentBlobUrl;
    })
    .catch(err =&gt; {
      // Fallback: load URL directly in iframe (handles CORS / external hosts)
      console.warn(&#39;Blob load failed, trying direct iframe:&#39;, err.message);
      gameFrame.src = url;
      // Still show a soft note if it fails later; for now hide error
      hideModalError();
    });
}

function closeModal() {
  gameModal.classList.remove(&#39;open&#39;);
  gameModal.style.display = &#39;none&#39;;
  document.body.style.overflow = &#39;&#39;;
  gameFrame.src = &#39;about:blank&#39;;
  hideModalError();
  if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
  // Exit fullscreen if active
  if (document.fullscreenElement) {
    document.exitFullscreen().catch(() =&gt; {});
  }
}

/* Fullscreen button */
document.getElementById(&#39;fullscreenBtn&#39;).onclick = () =&gt; {
  if (!document.fullscreenElement) {
    gameModal.requestFullscreen().catch(err =&gt; {
      console.log(&#39;Fullscreen error:&#39;, err);
    });
  } else {
    document.exitFullscreen();
  }
};

/* ========== SETTINGS UI ========== */
const panel   = document.getElementById(&#39;settingsPanel&#39;);
const overlay = document.getElementById(&#39;settingsOverlay&#39;);

function openSettings() {
  document.getElementById(&#39;setPrimary&#39;).value = settings.primary;
  document.getElementById(&#39;setBg&#39;).value = settings.bg;
  document.getElementById(&#39;setGlow&#39;).value = settings.glow;
  document.getElementById(&#39;setBlur&#39;).value = settings.blur;
  document.getElementById(&#39;setCard&#39;).value = settings.card;
  document.getElementById(&#39;setFont&#39;).value = settings.font;
  document.getElementById(&#39;setAnim&#39;).value = settings.anim;
  document.getElementById(&#39;setParticles&#39;).value = settings.particles;
  document.getElementById(&#39;setClockFormat&#39;).value = settings.clockFormat;
  document.getElementById(&#39;setReducedMotion&#39;).checked = settings.reducedMotion;
  document.getElementById(&#39;setStealth&#39;).checked = settings.stealth;
  applySettings();
  panel.classList.add(&#39;open&#39;);
  overlay.classList.add(&#39;show&#39;);
}
function closeSettings() {
  panel.classList.remove(&#39;open&#39;);
  overlay.classList.remove(&#39;show&#39;);
  saveSettings();
}

document.getElementById(&#39;openSettings&#39;).onclick = openSettings;
document.getElementById(&#39;closeSettings&#39;).onclick = closeSettings;
overlay.onclick = closeSettings;

document.getElementById(&#39;setPrimary&#39;).oninput = e =&gt; { settings.primary = e.target.value; applySettings(); };
document.getElementById(&#39;setBg&#39;).oninput = e =&gt; { settings.bg = e.target.value; applySettings(); };
document.getElementById(&#39;setGlow&#39;).oninput = e =&gt; { settings.glow = +e.target.value; applySettings(); };
document.getElementById(&#39;setBlur&#39;).oninput = e =&gt; { settings.blur = +e.target.value; applySettings(); };
document.getElementById(&#39;setCard&#39;).oninput = e =&gt; { settings.card = +e.target.value; applySettings(); };
document.getElementById(&#39;setFont&#39;).oninput = e =&gt; { settings.font = +e.target.value; applySettings(); };
document.getElementById(&#39;setAnim&#39;).oninput = e =&gt; { settings.anim = +e.target.value; applySettings(); };
document.getElementById(&#39;setParticles&#39;).oninput = e =&gt; { settings.particles = +e.target.value; applySettings(); };
document.getElementById(&#39;setClockFormat&#39;).onchange = e =&gt; { settings.clockFormat = e.target.value; updateClock(); };
document.getElementById(&#39;setReducedMotion&#39;).onchange = e =&gt; { settings.reducedMotion = e.target.checked; applySettings(); };
document.getElementById(&#39;setStealth&#39;).onchange = e =&gt; { settings.stealth = e.target.checked; applySettings(); };

document.getElementById(&#39;resetSettings&#39;).onclick = () =&gt; {
  settings = { ...DEFAULTS };
  applySettings();
  openSettings();
};

searchInput.addEventListener(&#39;input&#39;, () =&gt; {
  clearTimeout(window._searchTimer);
  window._searchTimer = setTimeout(handleSearch, 140);
});

document.getElementById(&#39;closeBtn&#39;).onclick = closeModal;
document.addEventListener(&#39;keydown&#39;, e =&gt; {
  if (e.key === &#39;Escape&#39;) {
    if (panel.classList.contains(&#39;open&#39;)) closeSettings();
    else if (gameModal.style.display === &#39;flex&#39;) closeModal();
  }
});

applySettings();
updateClock();
setInterval(updateClock, 1000);
window.addEventListener(&#39;load&#39;, loadAllSources);
    </script>
  </body>
</html>
